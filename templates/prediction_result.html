{% extends 'base.html' %}

{% block title %}
Prediction Result
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card p-4">

        <h2>
            Predicted Measurements
        </h2>

        <table class="table">

            <tr>
                <th>Chest</th>
                <td>{{ prediction.chest }}</td>
            </tr>

            <tr>
                <th>Waist</th>
                <td>{{ prediction.waist }}</td>
            </tr>

            <tr>
                <th>Hip</th>
                <td>{{ prediction.hip }}</td>
            </tr>

            <tr>
                <th>Shoulder</th>
                <td>{{ prediction.shoulder }}</td>
            </tr>

        </table>

    </div>

</div>

{% endblock %}
