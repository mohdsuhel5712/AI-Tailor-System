{% extends "base.html" %}
{% block title %}
AI AlterFit | Print Request
{% endblock %}
{% block content %}
<style>
    .print-page {
        min-height: 100vh;
        background:
            radial-gradient(circle at 5% 0%, rgba(91, 91, 214, 0.07), transparent 28%),
            radial-gradient(circle at 95% 5%, rgba(139, 124, 246, 0.06), transparent 25%),
            #f5f6f8;
        padding: 28px 0 60px;
    }
    /* =========================
       PAGE HERO
    ========================= */
    .print-hero {
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg,
                #10131a 0%,
                #171b24 55%,
                #292d40 100%);
        color: white;
        border-radius: 24px;
        padding: 28px 32px;
        margin-bottom: 20px;
        box-shadow: 0 18px 45px rgba(16, 19, 26, 0.15);
    }
    .print-hero::before {
        content: "";
        position: absolute;
        width: 230px;
        height: 230px;
        border-radius: 50%;
        background: rgba(139, 124, 246, 0.10);
        top: -130px;
        right: -50px;
    }
    .hero-content {
        position: relative;
        z-index: 2;
    }
    .hero-kicker {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #b9b5ff;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 8px;
    }
    .print-hero h1 {
        font-size: clamp(27px, 4vw, 38px);
        font-weight: 800;
        letter-spacing: -0.8px;
        margin-bottom: 6px;
    }
    .print-hero p {
        color: #b9bec9;
        margin: 0;
        line-height: 1.6;
        font-size: 14px;
    }
    .hero-actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
    }
    .hero-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border-radius: 11px;
        padding: 10px 15px;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        transition: all 0.2s ease;
    }
    .hero-btn:hover {
        transform: translateY(-2px);
    }
    .hero-btn-light {
        color: white;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .hero-btn-light:hover {
        color: white;
        background: rgba(255, 255, 255, 0.15);
    }
    .hero-btn-print {
        color: #171a21;
        background: white;
        border: 1px solid white;
    }
    .hero-btn-print:hover {
        color: #171a21;
        background: #f1f2f4;
    }
    /* =========================
       DOCUMENT
    ========================= */
    .document-shell {
        max-width: 920px;
        margin: auto;
    }
    .document {
        background: white;
        border: 1px solid #e2e5e9;
        border-radius: 21px;
        padding: 42px;
        box-shadow: 0 15px 40px rgba(16, 19, 26, 0.09);
        animation: documentIn 0.45s ease both;
    }
    .document-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 25px;
        padding-bottom: 25px;
        border-bottom: 2px solid #171a21;
    }
    .brand-area {
        display: flex;
        align-items: center;
        gap: 14px;
    }
    .brand-icon {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: #171a21;
        color: white;
        font-size: 23px;
    }
    .brand-name {
        color: #171a21;
        font-size: 25px;
        font-weight: 900;
        letter-spacing: -0.5px;
    }
    .brand-tagline {
        color: #777d87;
        font-size: 11px;
        margin-top: 2px;
    }
    .document-meta {
        text-align: right;
    }
    .meta-label {
        color: #858a94;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 800;
    }
    .meta-value {
        color: #171a21;
        font-size: 16px;
        font-weight: 800;
        margin-top: 3px;
    }
    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 9px;
        padding: 7px 12px;
        border-radius: 20px;
        background: #f1f3f5;
        color: #343840;
        border: 1px solid #dfe3e7;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.4px;
    }
    /* =========================
       SECTION
    ========================= */
    .document-section {
        margin-top: 28px;
        break-inside: avoid;
    }
    .section-heading {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 10px;
        margin-bottom: 12px;
        border-bottom: 1px solid #e4e7eb;
    }
    .section-icon {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9px;
        background: #f0f1ff;
        color: #5b5bd6;
        font-size: 15px;
    }
    .section-title {
        color: #20232a;
        font-size: 15px;
        font-weight: 800;
        margin: 0;
    }
    .details-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        border: 1px solid #e3e6ea;
        border-radius: 12px;
    }
    .details-table td {
        padding: 11px 13px;
        border-bottom: 1px solid #e7e9ed;
        font-size: 13px;
        vertical-align: top;
        line-height: 1.55;
    }
    .details-table tr:last-child td {
        border-bottom: 0;
    }
    .details-table td:first-child {
        width: 30%;
        background: #f8f9fa;
        color: #646a74;
        font-weight: 700;
    }
    .details-table td:last-child {
        color: #20232a;
        font-weight: 600;
        word-break: break-word;
    }
    .description {
        white-space: pre-wrap;
    }
    /* =========================
       FOOTER
    ========================= */
    .document-footer {
        margin-top: 35px;
        padding-top: 18px;
        border-top: 1px solid #dfe2e6;
        text-align: center;
        color: #777d87;
        font-size: 10px;
        line-height: 1.7;
    }
    .document-footer strong {
        color: #343840;
    }
    /* =========================
       LOADING
    ========================= */
    .loading-state {
        text-align: center;
        padding: 90px 20px;
        color: #777d87;
    }
    .loading-state i {
        font-size: 34px;
        color: #5b5bd6;
    }
    .loading-state p {
        margin-top: 12px;
        font-size: 13px;
    }
    .error-state {
        text-align: center;
        padding: 65px 20px;
    }
    .error-icon {
        width: 58px;
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: auto;
        border-radius: 16px;
        background: #fff0f0;
        color: #dc3545;
        font-size: 25px;
    }
    .error-state h4 {
        margin-top: 15px;
        font-weight: 800;
    }
    .error-state p {
        color: #777d87;
        font-size: 13px;
    }
    /* =========================
       ANIMATION
    ========================= */
    @keyframes documentIn {
        from {
            opacity: 0;
            transform: translateY(12px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 768px) {
        .print-page {
            padding: 20px 0 45px;
        }
        .print-hero {
            padding: 23px 19px;
            border-radius: 20px;
        }
        .hero-actions {
            width: 100%;
        }
        .hero-actions .hero-btn {
            flex: 1;
            justify-content: center;
        }
        .document {
            padding: 23px 18px;
            border-radius: 17px;
        }
        .document-header {
            flex-direction: column;
        }
        .document-meta {
            text-align: left;
        }
        .details-table td {
            padding: 9px 10px;
            font-size: 12px;
        }
        .details-table td:first-child {
            width: 38%;
        }
    }
    /* =========================
       PRINT
    ========================= */
    @media print {
        @page {
            size: A4;
            margin: 12mm;
        }
        html,
        body {
            background: white !important;
        }
        body {
            padding: 0 !important;
        }
        .print-page {
            min-height: auto;
            padding: 0;
            background: white !important;
        }
        .print-hero,
        .screen-only {
            display: none !important;
        }
        .document-shell {
            max-width: 100%;
            margin: 0;
        }
        .document {
            border: 0;
            border-radius: 0;
            box-shadow: none;
            padding: 0;
            animation: none;
        }
        .document-section {
            break-inside: avoid;
        }
        .details-table {
            page-break-inside: avoid;
        }
        .section-heading {
            break-after: avoid;
        }
    }
</style>
<div class="print-page">

        <!-- =========================

            <div class="hero-content">

</div>
<script>
    /* =========================================================
       GET REQUEST ID
    ========================================================= */
    const urlParams =
        new URLSearchParams(
            window.location.search
        );
    const requestId =
        urlParams.get("id");
    /* =========================================================
       LOAD REQUEST
    ========================================================= */
    function loadRequest() {
        if (!requestId) {
            showError(
                "Request ID is missing."
            );
            return;
        }
        fetch(
            `/api/alteration-request/${requestId}`
        )
            .then(response => {
                return response.json();
            })
            .then(result => {
                if (!result.success) {
                    showError(
                        result.message ||
                        "Request not found."
                    );
                    return;
                }
                displayRequest(
                    result.data
                );
            })
            .catch(error => {
                console.error(
                    "API ERROR:",
                    error
                );
                showError(
                    "Unable to load request details."
                );
            });
    }
    /* =========================================================
       DISPLAY REQUEST
    ========================================================= */
    function displayRequest(request) {
        document.title =
            `AI AlterFit - Request #${request.request_id}`;
        const html = `
            <!-- DOCUMENT HEADER -->
            <div class="document-header">
                <div class="brand-area">
                    <div class="brand-icon">
                        <i class="bi bi-scissors"></i>
                    </div>
                    <div>
                        <div class="brand-name">
                            AI AlterFit
                        </div>
                        <div class="brand-tagline">
                            Smart Garment Alteration & Tailoring Service
                        </div>
                    </div>
                </div>
                <div class="document-meta">
                    <div class="meta-label">
                        Alteration Request
                    </div>
                    <div class="meta-value">
                        #${safePDF(request.request_id)}
                    </div>
                    <div class="status-badge">
                        <i class="bi bi-circle-fill"></i>
                        ${safePDF(request.status)}
                    </div>
                </div>
            </div>
            <!-- CUSTOMER INFORMATION -->
            <div class="document-section">
                <div class="section-heading">
                    <div class="section-icon">
                        <i class="bi bi-person"></i>
                    </div>
                    <h3 class="section-title">
                        Customer Information
                    </h3>
                </div>
                <table class="details-table">
                    <tr>
                        <td>
                            Customer Name
                        </td>
                        <td>
                            ${safePDF(request.customer_name)}
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Phone
                        </td>
                        <td>
                            ${safePDF(request.phone)}
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Category
                        </td>
                        <td>
                            ${safePDF(request.category)}
                        </td>
                    </tr>
                </table>
            </div>
            <!-- GARMENT & SERVICE -->
            <div class="document-section">
                <div class="section-heading">
                    <div class="section-icon">
                        <i class="bi bi-bag"></i>
                    </div>
                    <h3 class="section-title">
                        Garment & Service Details
                    </h3>
                </div>
                <table class="details-table">
                    <tr>
                        <td>
                            Garment Type
                        </td>
                        <td>
                            ${safePDF(request.garment_type)}
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Service Type
                        </td>
                        <td>
                            ${safePDF(request.service_type)}
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Alteration Type
                        </td>
                        <td>
                            ${safePDF(request.alteration_type)}
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Customer Requirement
                        </td>
                        <td class="description">
                            ${safePDF(request.description)}
                        </td>
                    </tr>
                </table>
            </div>
            <!-- PICKUP -->
            <div class="document-section">
                <div class="section-heading">
                    <div class="section-icon">
                        <i class="bi bi-truck"></i>
                    </div>
                    <h3 class="section-title">
                        Pickup Information
                    </h3>
                </div>
                <table class="details-table">
                    <tr>
                        <td>
                            Pickup Address
                        </td>
                        <td>
                            ${safePDF(request.pickup_address)}
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Preferred Pickup Date
                        </td>
                        <td>
                            ${formatPDFDate(
            request.preferred_pickup_date
        )}
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Preferred Pickup Time
                        </td>
                        <td>
                            ${formatPDFTime(
            request.preferred_pickup_time
        )}
                        </td>
                    </tr>
                </table>
            </div>
            <!-- TAILOR -->
            <div class="document-section">
                <div class="section-heading">
                    <div class="section-icon">
                        <i class="bi bi-person-workspace"></i>
                    </div>
                    <h3 class="section-title">
                        Tailor & Work Information
                    </h3>
                </div>
                <table class="details-table">
                    <tr>
                        <td>
                            Assigned Tailor
                        </td>
                        <td>
                            ${safePDF(
            request.tailor_name
        )}
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Work Status
                        </td>
                        <td>
                            ${safePDF(
            request.status
        )}
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Work Notes
                        </td>
                        <td class="description">
                            ${safePDF(
            request.admin_notes
        )}
                        </td>
                    </tr>
                </table>
            </div>
            <!-- REQUEST TIMELINE -->
            <div class="document-section">
                <div class="section-heading">
                    <div class="section-icon">
                        <i class="bi bi-calendar3"></i>
                    </div>
                    <h3 class="section-title">
                        Request Information
                    </h3>
                </div>
                <table class="details-table">
                    <tr>
                        <td>
                            Request Created
                        </td>
                        <td>
                            ${formatPDFDateTime(
            request.created_at
        )}
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Last Updated
                        </td>
                        <td>
                            ${formatPDFDateTime(
            request.updated_at
        )}
                        </td>
                    </tr>
                </table>
            </div>
            <!-- FOOTER -->
            <div class="document-footer">
                <strong>
                    AI AlterFit
                </strong>
                — Smart Garment Alteration & Virtual Fitting Platform
                <br>
                This document is generated from the AI AlterFit request management system.
                <br>
                Generated on
                ${new Date().toLocaleString("en-IN")}
            </div>
        `;
        document.getElementById(
            "printContainer"
        ).innerHTML = html;
    }
    /* =========================================================
       SAFE VALUE
    ========================================================= */
    function safePDF(value) {
        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return "-";
        }
        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            );
    }
    /* =========================================================
       FORMAT DATE
    ========================================================= */
    function formatPDFDate(value) {
        if (!value) {
            return "-";
        }
        const date =
            new Date(value);
        if (
            isNaN(
                date.getTime()
            )
        ) {
            return value;
        }
        return date.toLocaleDateString(
            "en-IN"
        );
    }
    /* =========================================================
       FORMAT TIME
    ========================================================= */
    function formatPDFTime(value) {
        if (!value) {
            return "-";
        }
        if (
            typeof value === "string"
        ) {
            return value.substring(
                0,
                5
            );
        }
        return value;
    }
    /* =========================================================
       FORMAT DATE + TIME
    ========================================================= */
    function formatPDFDateTime(value) {
        if (!value) {
            return "-";
        }
        const date =
            new Date(value);
        if (
            isNaN(
                date.getTime()
            )
        ) {
            return value;
        }
        return date.toLocaleString(
            "en-IN",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );
    }
    /* =========================================================
       ERROR
    ========================================================= */
    function showError(message) {
        document.getElementById(
            "printContainer"
        ).innerHTML = `
            <div class="error-state">
                <div class="error-icon">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <h4>
                    Unable to Load Request
                </h4>
                <p>
                    ${safePDF(message)}
                </p>
                <a
                    href="/dashboard"
                    class="btn btn-dark btn-sm"
                >
                    <i class="bi bi-arrow-left me-1"></i>
                    Back to Dashboard
                </a>
            </div>
        `;
    }
    /* =========================================================
       START
    ========================================================= */
    loadRequest();
</script>
{% endblock %}
